[project]
name = "SuperHermes"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "pymilvus>=2.5.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.8.0",
    "langchain>=0.2.14",
    "langchain-core>=0.2.37",
    "langchain-community>=0.2.12",
    "langchain-huggingface>=0.1.0",
    "langchain-openai>=0.1.22",
    "sentence-transformers>=3.0.0",
    "langgraph>=0.2.31",
    "pypdf>=4.3.1",
    "docx2txt>=0.8",
    "unstructured",
    "openpyxl",
    "msoffcrypto-tool",
    "sqlalchemy>=2.0.36",
    "psycopg2-binary>=2.9.10",
    "redis>=5.2.1",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "jieba>=0.42.1",
    "torch>=2.11.0",
    # DeepDoc vision / parser runtime
    "xgboost>=2.1.0,<3.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "opencv-python-headless>=4.10.0",
    "onnxruntime>=1.20.0,<1.23",
    "huggingface_hub>=0.25.0",
    "chardet>=5.2.0",
    "six>=1.16.0",
    "shapely>=2.0.0",
    "pyclipper>=1.3.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.optional-dependencies]
study = [
    "langchain-classic>=0.2.0",
    "chromadb>=0.5.5",
    "bilibili-api-python>=17.0.0",
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests that are slow (e.g. DeepDoc integration)",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "nltk>=3.9.0",
]
